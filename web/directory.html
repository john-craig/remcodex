<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemCodex Directory</title>
    <meta name="theme-color" content="#fff9f1" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="/directory.css" />
  </head>
  <body>
    <div class="directory-glow directory-glow-left"></div>
    <div class="directory-glow directory-glow-right"></div>
    <main class="directory-shell">
      <header class="directory-hero">
        <p class="directory-eyebrow">Remote control for Codex</p>
        <h1>RemCodex Directory</h1>
        <p class="directory-intro">Choose a RemCodex workspace to open.</p>
      </header>
      <section id="directory-list" class="directory-list" aria-live="polite">
        <p class="directory-message">Loading workspaces…</p>
      </section>
    </main>
    <script type="module" src="/directory.js"></script>
  </body>
</html>
